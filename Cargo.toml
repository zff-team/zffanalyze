[package]
name = "zffanalyze"
authors = ["ph0llux <ph0llux@pm.me>"]
version = "2.0.0-beta.2"
edition = "2021"
rust-version = "1.89.0"
license = "GPL-3.0-only"
description = "A command line utility to analyze zff files."
homepage = "https://zff.dev"
repository = "https://github.com/zff-team/zffanalyze"
keywords = ["forensics", "security", "file-format", "file"]
categories = ["command-line-utilities"]
publish = true
autobins = false

[[bin]]
name = "zffanalyze"
path = "src/bin/main.rs"
test = true
bench = true

[dependencies]
clap = { version = "4.5.54", features = [ "derive" ] }
zff = { version = "3.0.0", features = ["serde", "log"] }
hex = "0.4"
time = { version = "0.3.55", features = [ "formatting" ] }
toml = "0.9.8"
serde_json = "1.0.149"
serde = { version = "1.0", features = ["derive"] }
log = "0.4.29"
env_logger = "0.11.8"
dialoguer = "0.12"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3.20"
base64 = "0.22.1"
