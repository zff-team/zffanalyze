name: Build and test

on: [push, pull_request]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            toolchain: stable
          - os: ubuntu-24.04
            toolchain: '1.89.0'
          - os: ubuntu-24.04-arm
            toolchain: stable
          - os: windows-2025
            toolchain: stable
          - os: windows-11-arm
            toolchain: stable
          - os: macos-15
            toolchain: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-features
      - name: Verify crate package
        if: matrix.os == 'ubuntu-24.04' && matrix.toolchain == 'stable'
        run: cargo package --locked
