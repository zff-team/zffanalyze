name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: zffanalyze
            asset: zffanalyze-x86_64-linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: zffanalyze
            asset: zffanalyze-aarch64-linux
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: zffanalyze.exe
            asset: zffanalyze-x86_64-windows.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: zffanalyze.exe
            asset: zffanalyze-aarch64-windows.exe
          - os: macos-15
            target: aarch64-apple-darwin
            binary: zffanalyze
            asset: zffanalyze-aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        run: cargo test --locked --all-features --target ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p release
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "release/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error

  attach:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zffanalyze-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            release/zffanalyze-x86_64-linux
            release/zffanalyze-aarch64-linux
            release/zffanalyze-x86_64-windows.exe
            release/zffanalyze-aarch64-windows.exe
            release/zffanalyze-aarch64-macos
